name: Feature request
description: Suggest a Kentix or Home Assistant capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Explain the user-visible capability, not customer-specific installation details.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: SmartAPI reference
      description: Link or name the documented KentixONE operation when known.
