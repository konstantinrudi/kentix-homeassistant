name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches manifest
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          manifest = json.loads(
              Path("custom_components/kentix/manifest.json").read_text()
          )
          if tag != manifest["version"]:
              raise SystemExit(
                  f"Tag v{tag} does not match manifest {manifest['version']}"
              )
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
